[project]
name = "PrMarketingV2Agent"
version = "0.1.0"
description = "Turns merged GitHub pull requests and their Confluence feature documentation into marketing drafts for human approval."
authors = [{ name = "Calfus Inc.", email = "cloudops@calfus.com" }]
requires-python = ">=3.12.10,<3.13"

dependencies = [
    # Platform-specific wheel (Darwin arm64 shown; swap for your platform's wheel).
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.91-cp312-cp312-macosx_26_0_arm64.whl",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "reportlab>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "pytest-mock>=3.12.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The SDK pulls in arize-phoenix-client, whose pytest plugin fails to import
# (strawberry vs graphql-core version clash). We don't use it.
addopts = "-p no:phoenix"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
