[project]
name = "PrMarketingChatAgent"
version = "0.1.0"
description = "Chat assistant for marketing: explains what the product team ships (docs + Jira) and writes on-brand posts, blogs and Calfus-branded visuals."
authors = [{ name = "Calfus Inc.", email = "cloudops@calfus.com" }]
requires-python = ">=3.12.10,<3.13"

dependencies = [
    # From CodeArtifact (index below). chat_direct needs >= 0.0.106; keep in step with the
    # SDK in the supernova worker image the bundle runs on.
    "aetherion_sdk==0.0.118",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pillow>=10.4.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "reportlab>=4.2.0",
    # The bundle ships without uv.lock, so the image build re-resolves every dependency.
    # graphql-core 3.3 breaks strawberry-graphql (pinned via agent_lib): the worker dies on import.
    "graphql-core>=3.2,<3.3",
]

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "codeartifact"
url = "https://aetherion-285774563994.d.codeartifact.us-east-1.amazonaws.com/pypi/aetherion/simple/"
explicit = true

[tool.uv.sources]
aetherion_sdk = { index = "codeartifact" }

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "pytest-mock>=3.12.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Prompt strings are long by nature.
extend-ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
